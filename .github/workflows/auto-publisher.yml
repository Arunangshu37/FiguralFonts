name: Build and Push Artifacts

on:
  workflow_run:
    workflows: ["Run tests"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Use actions/checkout to get the repository code
        uses: actions/checkout@v4
        with:
          # This token has 'read and write' permissions by default for same-repo actions
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Setup Node.js (or your build environment)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build
          # The build output is usually in a directory like 'dist' or 'build'

      - name: Commit and push build artifacts to a new branch
        uses: EndBug/add-and-commit@v9
        with:
          # The message for the commit
          message: 'Build artifacts generated by CI'
          # Add all files in the build directory
          add: 'dist' # Replace 'dist' with your actual build output directory
          # Specify the target branch
          branch: 'master' # The branch name you want to push to